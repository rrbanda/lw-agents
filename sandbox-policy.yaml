# Network policy for the lw-agents ADK service sandbox.
#
# Controls what the ADK agent service can reach:
# - LLM endpoint (MaaS or Gemini API) for inference
# - SCM (GitLab/GitHub) for issue/PR creation
# - Maven Central for version verification
# - MLflow for tracing
#
# Apply with: openshell policy set lw-agents --policy sandbox-policy.yaml --wait
#
# The OpenCode sandbox has its own policy: sandbox-policy-opencode.yaml

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /etc
    - /var/log
    - /dev/urandom
    - /opt/openshell
    - /opt/app-root
  read_write:
    - /tmp
    - /dev/null
    - /workspace

landlock:
  compatibility: best_effort

network_policies:
  # Red Hat MaaS — model serving for LLM inference
  # Update host to match your cluster's MaaS route
  maas_inference:
    name: Red Hat MaaS
    endpoints:
      - host: maas.apps.ocp.example.com
        port: 443
        tls: skip
        access: full
    binaries:
      - path: /**

  # Google Gemini API — alternative LLM inference
  gemini_api:
    name: Google Gemini API
    endpoints:
      - host: generativelanguage.googleapis.com
        port: 443
        tls: skip
        access: full
    binaries:
      - path: /**

  # Maven Central — version verification (check_version_exists)
  maven_central:
    name: Maven Central
    endpoints:
      - host: repo1.maven.org
        port: 443
        tls: skip
        access: full
    binaries:
      - path: /**

  # MLflow tracking server — trace export
  mlflow_tracking:
    name: MLflow tracking server
    endpoints:
      - host: mlflow-redhat-ods-applications.apps.ocp.example.com
        port: 443
        tls: skip
        access: full
    binaries:
      - path: /**

  # GitLab — issue creation and MR opening
  gitlab:
    name: GitLab SCM
    endpoints:
      - host: gitlab.example.com
        port: 443
        tls: skip
        access: full
    binaries:
      - path: /**

  # GitHub — issue creation and PR opening
  github:
    name: GitHub SCM
    endpoints:
      - host: github.com
        port: 443
        tls: skip
        access: full
      - host: api.github.com
        port: 443
        tls: skip
        access: full
    binaries:
      - path: /**

  # OpenShell gateway
  openshell_gateway:
    name: OpenShell gateway
    endpoints:
      - host: openshell.openshell.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /opt/openshell/bin/openshell-sandbox

  # Cluster DNS
  cluster_dns:
    name: Cluster DNS
    endpoints:
      - host: "172.30.0.10"
        port: 53
      - host: "172.30.0.10"
        port: 5353
    binaries:
      - path: /**
