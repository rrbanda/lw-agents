# Network policy for the lw-agents OpenCode sandbox.
#
# Default-deny: only the endpoints listed below are reachable.
# Apply with: openshell policy set <sandbox-name> --policy sandbox-policy.yaml --wait
#
# Follows the same pattern as agent-ops/demos/opencode-vertex-tracing.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /etc
    - /var/log
    - /dev/urandom
    - /opt/openshell
    - /opt/apache-maven-3.9.9
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /root
    - /run
    - /home

landlock:
  compatibility: best_effort

network_policies:
  # Maven Central — dependency downloads and version verification
  maven_central:
    name: Maven Central
    endpoints:
      - host: repo1.maven.org
        port: 443
        tls: skip
        access: full
    binaries:
      - path: /**

  # Red Hat MaaS — model serving (OpenCode LLM inference)
  # Update host to match your cluster's MaaS route
  maas_inference:
    name: Red Hat MaaS
    endpoints:
      - host: maas.apps.ocp.example.com
        port: 443
        tls: skip
        access: full
    binaries:
      - path: /**

  # MLflow tracking server — trace export
  # Update host to match your cluster's MLflow route
  mlflow_tracking:
    name: MLflow tracking server
    endpoints:
      - host: mlflow-redhat-ods-applications.apps.ocp.example.com
        port: 443
        tls: skip
        access: full
    binaries:
      - path: /**

  # GitLab — issue creation and PR/MR opening
  # Update host to match your GitLab instance
  gitlab:
    name: GitLab SCM
    endpoints:
      - host: gitlab.example.com
        port: 443
        tls: skip
        access: full
    binaries:
      - path: /**

  # GitHub — issue creation and PR opening (if using GitHub)
  github:
    name: GitHub SCM
    endpoints:
      - host: github.com
        port: 443
        tls: skip
        access: full
      - host: api.github.com
        port: 443
        tls: skip
        access: full
    binaries:
      - path: /**

  # PyPI — for future Python ecosystem support
  pypi_registry:
    name: PyPI packages
    endpoints:
      - host: pypi.org
        port: 443
        tls: skip
        access: full
      - host: files.pythonhosted.org
        port: 443
        tls: skip
        access: full
    binaries:
      - path: /**

  # OpenShell gateway — internal sandbox management
  openshell_gateway:
    name: OpenShell gateway
    endpoints:
      - host: openshell.openshell.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /opt/openshell/bin/openshell-sandbox

  # Cluster DNS
  cluster_dns:
    name: Cluster DNS
    endpoints:
      - host: "172.30.0.10"
        port: 53
      - host: "172.30.0.10"
        port: 5353
    binaries:
      - path: /**
