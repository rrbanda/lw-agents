apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: call-ssc-agent
  labels:
    app.kubernetes.io/part-of: maven-build-ci
  annotations:
    tekton.dev/tags: "ai, agent, adk"
spec:
  description: >-
    Thin Tekton task that calls the ADK agent service via HTTP API.
    All AI logic runs in the agent service — this task is just a
    curl-based API caller that maps workspace files to agent requests
    and agent responses to Tekton results.
  params:
    - name: AGENT_ENDPOINT
      type: string
      description: Base URL of the ADK agent service.
      default: http://ssc-agent.tssc-app-ci.svc:8080
    - name: TASK_TYPE
      type: string
      description: "Agent task type: select-cve | analyze-cves | remediate | generate-tests"
    - name: WORKSPACE_PATH
      type: string
      default: /workspace/source
    - name: REQUEST_BODY
      type: string
      description: JSON request body for the agent (task-specific params).
      default: "{}"
  workspaces:
    - name: workspace
  results:
    - name: AGENT_RESPONSE
      description: Raw JSON response from the agent.
    - name: SELECTED
      description: "Selection result (for select-cve): 1 or 0"
    - name: CVE_ID
    - name: PACKAGE
    - name: CURRENT_VERSION
    - name: FIXED_VERSION
    - name: JUSTIFICATION
    - name: PR_URL
      description: URL of the created PR/MR (for remediate/generate-tests).
  steps:
    - name: call-agent
      # ubi9 (not ubi-minimal) includes curl, jq-like tools, and python3
      image: registry.access.redhat.com/ubi9/ubi:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Install curl if not present (ubi9 ships it, but be defensive)
        command -v curl >/dev/null 2>&1 || dnf install -y -q curl

        ENDPOINT="$(params.AGENT_ENDPOINT)"
        TASK_TYPE="$(params.TASK_TYPE)"

        echo "Calling agent: ${ENDPOINT} task=${TASK_TYPE}"

        # Build the prompt based on task type
        case "${TASK_TYPE}" in
          select-cve)
            PROMPT="Select the best CVE to remediate. Workspace path: $(params.WORKSPACE_PATH)"
            ;;
          analyze-cves)
            PROMPT="Analyze all CVEs and create issues. Workspace path: $(params.WORKSPACE_PATH)"
            ;;
          remediate)
            PROMPT="Remediate this vulnerability: $(params.REQUEST_BODY)"
            ;;
          generate-tests)
            PROMPT="Generate unit tests. Workspace path: $(params.WORKSPACE_PATH)"
            ;;
          *)
            echo "Unknown TASK_TYPE: ${TASK_TYPE}" >&2
            exit 1
            ;;
        esac

        # Call the ADK agent API
        # ADK api_server exposes /run on /apps/{app_name}/users/{user_id}/sessions/{session_id}/run
        # For stateless calls, create a session first or use the /run shorthand
        RESPONSE=$(curl -sf -X POST "${ENDPOINT}/run" \
          -H "Content-Type: application/json" \
          -d "{\"app_name\": \"app\", \"user_id\": \"tekton\", \"new_message\": {\"role\": \"user\", \"parts\": [{\"text\": \"${PROMPT}\"}]}}" \
          --max-time 600) || {
            echo "ERROR: Agent call failed" >&2
            # Write empty defaults on failure
            for r in AGENT_RESPONSE SELECTED CVE_ID PACKAGE CURRENT_VERSION FIXED_VERSION JUSTIFICATION PR_URL; do
              printf '' > "$(results.${r}.path)"
            done
            exit 1
          }

        printf '%s' "${RESPONSE}" > "$(results.AGENT_RESPONSE.path)"

        # Extract structured results from session state.
        # The agent's after_agent_callback writes state["structured_result"]
        # which the ADK API includes in the response JSON.
        # Use python3 (available on ubi9) for robust JSON parsing.
        python3 - "${RESPONSE}" <<'PYEOF'
import json, sys

try:
    data = json.loads(sys.argv[1])
except (json.JSONDecodeError, IndexError):
    data = {}

# ADK api_server returns session state under various paths depending
# on the response shape. Try common locations.
sr = {}
for path in (
    lambda d: d.get("structured_result", {}),
    lambda d: d.get("session", {}).get("state", {}).get("structured_result", {}),
    lambda d: d.get("state", {}).get("structured_result", {}),
):
    sr = path(data)
    if sr:
        break

FIELDS = {
    "SELECTED": "0", "CVE_ID": "", "PACKAGE": "",
    "CURRENT_VERSION": "", "FIXED_VERSION": "",
    "JUSTIFICATION": "", "PR_URL": "",
}
for field, default in FIELDS.items():
    val = str(sr.get(field, default))
    # Tekton results are written as files
    with open(f"/tekton/results/{field}", "w") as f:
        f.write(val)
PYEOF

        echo "Agent call complete."
