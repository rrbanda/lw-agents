apiVersion: apps/v1
kind: Deployment
metadata:
  name: lw-agents
  labels:
    app.kubernetes.io/name: lw-agents
    app.kubernetes.io/part-of: lightwell
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lw-agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lw-agents
    spec:
      containers:
        - name: agent
          image: quay.io/placeholder/lw-agents:latest
          command: ["python", "-m", "google.adk.cli", "web", "--host", "0.0.0.0", "--port", "8080", "/sandbox"]
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lw-agents-config
            - secretRef:
                name: lw-agents-secrets
                optional: true
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 12Gi
          readinessProbe:
            httpGet:
              path: /list-apps
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /list-apps
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
