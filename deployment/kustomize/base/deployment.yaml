apiVersion: apps/v1
kind: Deployment
metadata:
  name: lw-agents
  labels:
    app.kubernetes.io/name: lw-agents
    app.kubernetes.io/part-of: lightwell
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lw-agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lw-agents
    spec:
      containers:
        - name: agent
          image: quay.io/placeholder/lw-agents:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lw-agents-config
            - secretRef:
                name: lw-agents-secrets
                optional: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /list-apps
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /list-apps
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
