[project]
name = "lw-agents"
version = "0.1.0"
description = "AI-accelerated CVE remediation and test generation for software supply chain security, built on Google ADK"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["cve", "security", "remediation", "agents", "adk", "openshift", "lightwell"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "google-adk[otel-gcp]>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
eval = [
    "eval-hub-sdk[cli]>=1.0.0",
]
tracing = [
    "mlflow>=2.18.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
]
maas = [
    "rh-maas-litellm @ git+https://github.com/rrbanda/rh-maas-litellm.git",
]

[project.urls]
Homepage = "https://github.com/redhat-lightwell/lw-agents"
Repository = "https://github.com/redhat-lightwell/lw-agents"
Documentation = "https://github.com/redhat-lightwell/lw-agents/tree/main/docs"
Issues = "https://github.com/redhat-lightwell/lw-agents/issues"
Changelog = "https://github.com/redhat-lightwell/lw-agents/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
